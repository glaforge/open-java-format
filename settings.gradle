rootProject.name = 'open-java-format-parent'

include ':gradle-open-java-format'
include ':open-java-format-eclipse-plugin'
include ':open-java-format-idea-plugin'
include ':open-java-format-spi'
include ':open-java-format'
include ':open-java-format-jdk-bootstrap'
include ':open-java-format-benchmarks'
include ':open-java-format-native'

// The WebAssembly module compiles against Oracle GraalVM, which nobody who only wants the jars has, so it is part of
// the build only with -Pwasm=true. The release workflow builds it that way; nothing else does.
if (Boolean.parseBoolean(providers.gradleProperty('wasm').getOrElse('false'))) {
    include ':open-java-format-wasm'
}

boolean isCiServer = System.getenv().containsKey('CI')
buildCache {
    local {
        enabled = !isCiServer
    }
}
